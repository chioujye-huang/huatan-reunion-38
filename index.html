<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>花壇國中 三年Յ�班 畢業33週年同學會</title>
    <!-- 標楷體為系統字型，無需外部載入 -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; width: 100%; overflow-x: hidden; }
        body {
            font-family: 'Times New Roman', 'DFKai-SB', '標楷體', 'BiauKai', 'KaiTi', serif;
            background-color: #F9F6F0;
            color: #2C3E50;
            line-height: 1.8;
        }

        /* Animated Background */
        .animated-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background:
                radial-gradient(circle at 20% 50%, rgba(212,165,]6,0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(139,94,60,0.05) 0%, transparent 50%),
                linear-gradient(135deg, #F9F6F0 0%, #E8E2D8 50%, #F9F6F0 100%);
            z-index: -1; pointer-events: none;
        }
        .animated-circles { position: fixed; width: 100%; height: 100%; top: 0; left: 0; z-index: -1; overflow: hidden; pointer-events: none; }
        .circle { position: absolute; border-radius: 50%; opacity: 0.05; animation: float 20s infinite ease-in-out; }
        .circle:nth-child(1) { width: 200px; height: 200px; top: 10%; left: 10%; animation-delay: 0s; border: 2px solid rgba(212,165,]6,0.3); }
        .circle:nth-child(2) { width: 150px; height: 150px; top: 60%; left: 80%; animation-delay: 2s; border: 2px solid rgba(212,165,]6,0.3); }
        .circle:nth-child(3) { width: 250px; height: 250px; top: 50%; left: 50%; animation-delay: 4s; border: 2px solid rgba(212,165,]6,0.3); }
        .circle:nth-child(4) { width: 180px; height: 180px; top: 20%; left: 60%; animation-delay: 6s; border: 2px solid rgba(212,165,]6,0.3); }
        .circle:nth-child(5) { width: 120px; height: 120px; top: 80%; left: 20%; animation-delay: 8s; border: 2px solid rgba(212,165,]6,0.3); }
        @keyframes float { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(20px, -20px) scale(1.05); } }
        .sparkles { position: fixed; width: 100%; height: 100%; top: 0; left: 0; z-index: -1; overflow: hidden; pointer-events: none; }
        .sparkle { position: absolute; width: 4px; height: 4px; background-color: #C4A574; border-radius: 50%; opacity: 0; animation: twinkle 3s infinite; }
        @keyframes twinkle { 0%, 100% { opacity: 0; } 50% { opacity: 0.8; } }

        /* ==================== WELCOME PAGE ===================== */
        .welcome-page { color: #F9F6F0;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1000; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            background: linear-gradient(135deg, #2C3E50 0%, #3D5166 50%, #2C3E50 100%);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }
        .welcome-page.hidden {
            opacity: 0; pointer-events: none; transform: scale(1.05);
        }
        .welcome-header {
            text-align: center; animation: fadeInUp 1s ease;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .welcome-header h1 {
            font-family: 'DFKai-SB', '標楷體', 'BiauKai', serif; font-size: 2.8rem;
            color: #D4A574; text-shadow: 0 2px 15px rgba(212,131,107,0.4);
            margin-bottom: 0.3rem;
        }
